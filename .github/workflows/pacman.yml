name: Generate Pacman Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"  # runs every 12 hours
  workflow_dispatch:        # allows manual trigger
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pacman graph
        uses: platane/snk@v3
        with:
          github_user_name: sethupathy03
          outputs: |
            pacman-contribution-graph.svg?palette=github-dark&color_snake=#FFD700
            pacman-contribution-graph-dark.svg?palette=github-dark

      - name: Push to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
